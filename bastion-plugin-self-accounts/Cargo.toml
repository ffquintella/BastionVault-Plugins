[package]
name = "bastion-plugin-self-accounts"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Operator-registered accounts, picked at Connect. BastionVault credential-provider plugin (WASM, ABI 1.3). See features/self-accounts.md."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bastion-plugin-sdk = { path = "../../crates/bastion-plugin-sdk", features = ["provider"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Secrets are held in `Zeroizing` buffers and wiped on drop.
zeroize = { version = "1.8", features = ["alloc"] }
# Parses an OpenSSH private key on write so a malformed or passphrase-protected
# key is refused up front. Parsing only: no signing or key generation is used,
# so no algorithm features are enabled.
ssh-key = { version = "0.6", default-features = false, features = ["alloc"] }
# Digests the targets an account was released for (`accounts/<id>/seen`, the
# Phase 5 "first use on this target" badge), so the record never holds target
# text. Already in the graph through `ssh-key` (same 0.10 line); no default
# features, nothing beyond the hash is used.
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
bastion-plugin-sdk = { path = "../../crates/bastion-plugin-sdk", features = ["provider", "host_test", "surface"] }
bastion-plugin-testkit = { path = "../../crates/bastion-plugin-testkit" }
serial_test = "3"
bv_plugin_manifest = { path = "../../crates/bv-plugin-manifest" }
toml = "1.1"

[features]
# Passthrough so `cargo test --features host_test` exercises the handlers
# against the SDK's in-memory host stubs.
host_test = ["bastion-plugin-sdk/host_test"]
